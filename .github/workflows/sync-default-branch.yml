# 独立 workflow：push dev_* 时把 GitHub 默认分支设为数值最高的 dev_XX_YY_ZZ（与 CI 解耦）。
# workers-world actions bundle: actions/v0.2.30（禁止 @master）
# 勿设 contents: write——改默认分支走 PAT；GITHUB_TOKEN 应保持无权限。
name: Sync default branch

on:
  push:
    branches: ["dev_*"]

permissions: {}

concurrency:
  group: sync-default-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    # 默认已是当前 push 分支、或 lock-bot：不起 runner
    if: |
      github.actor != 'github-actions[bot]' &&
      github.event.repository.default_branch != github.ref_name
    permissions: {}
    uses: workers-world/worker-actions/.github/workflows/worker-sync-default-dev-branch.yml@actions/v0.2.30
    secrets: inherit
    with:
      push_branch: ${{ github.ref_name }}
      # bot: app   # 可选：改默认分支走独立 App（须配 DEFAULT_BRANCH_BOT_APP_ID 变量 +
      #              DEFAULT_BRANCH_BOT_PRIVATE_KEY Secret；App 仅安装到本仓），见 worker-actions docs/github-app-token-migration.md §5
